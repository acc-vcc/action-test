name: Build (Windows)

on:
  push:
    branches: [feature/app5]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Python を先にセットアップ（WindowsApps の偽 python.exe 問題を回避）
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Qt + MinGW をインストール
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.12.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw73'

      # Qt の MinGW を PATH に追加（最重要）
      - name: Add Qt MinGW to PATH
        run: |
          echo "${{ env.Qt5_Dir }}\bin" >> $env:GITHUB_PATH

      # CMake configure
      - name: Configure (CMake)
        run: |
          cmake -G "MinGW Makefiles" -S app5 -B build

      # Build
      - name: Build
        run: |
          cmake --build build -- -j4

      # exe のみ artifact として保存
      - name: Upload artifact (Windows exe)
        uses: actions/upload-artifact@v4
        with:
          name: qt-thread-csv-sample-windows
          path: build/*.exe
