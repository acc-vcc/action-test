name: Build (Windows)

on:
  push:
    branches: [feature/app5]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.12.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw73'

      - name: Add MinGW to PATH
        run: |
          echo "C:\Qt\Tools\mingw730_64\bin" >> $env:GITHUB_PATH

      - name: Configure (CMake)
        run: |
          cmake -G "MinGW Makefiles" -B build

      - name: Build
        run: |
          cmake --build build -- -j4

      - name: Upload artifact (Windows exe)
        uses: actions/upload-artifact@v4
        with:
          name: qt-thread-csv-sample-windows
          path: build/*.exe
